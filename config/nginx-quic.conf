# nginx HTTP/2 + HTTP/3 cho testbed. Chạy: sudo ./scripts/start_server.sh
user www-data;
worker_processes 2;            # KB2: giảm còn 1 để thấy điểm bão hoà sớm
pid /run/nginx-quic.pid;
quic_bpf on;                   # gói của 1 kết nối luôn về đúng worker, kể cả khi client đổi địa chỉ (KB3)
events { worker_connections 8192; }
http {
    access_log off;
    error_log /var/log/nginx/quic-error.log warn;
    sendfile on;
    keepalive_requests 100000;
    server {
        listen 443 quic reuseport;
        listen 443 ssl backlog=511;      # KB2: backlog nhỏ (vd 64) để thấy tràn hàng đợi TCP
        http2 on;
        http3 on;
        quic_gso off;                    # tắt để pcap giải mã được từng gói (KB1, KB3); KB4 bật lại để so sánh
        quic_retry off;
        ssl_protocols TLSv1.3;
        ssl_certificate     /etc/nginx/quic/cert.pem;
        ssl_certificate_key /etc/nginx/quic/key.pem;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        root /var/www/testfiles;
        location / { }
    }
}
